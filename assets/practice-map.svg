<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Practice Map</title>
  <desc id="desc">A visual map of Elliot Bai's creative product practice: taste, product systems, AI agents, and shipped code.</desc>
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171717"/>
      <stop offset="0.55" stop-color="#252525"/>
      <stop offset="1" stop-color="#092F35"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF4D6D"/>
      <stop offset="0.48" stop-color="#E8FF5B"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <pattern id="micro" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 19.5H20" stroke="#FFF7ED" stroke-opacity="0.08"/>
      <path d="M19.5 0V20" stroke="#FFF7ED" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="330" rx="28" fill="url(#back)"/>
  <rect width="1200" height="330" rx="28" fill="url(#micro)"/>
  <rect x="22" y="22" width="1156" height="286" rx="22" stroke="#FFF7ED" stroke-opacity="0.38" stroke-width="2"/>

  <text x="58" y="82" fill="#FFF7ED" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700">Practice Map</text>
  <text x="58" y="116" fill="#C8FFF2" font-family="Courier New, monospace" font-size="17">how I turn creative intent into AI design products</text>

  <path d="M83 198C232 118 329 250 466 168C591 94 686 246 817 165C947 84 1005 196 1117 126" stroke="url(#ribbon)" stroke-width="10" stroke-linecap="round"/>
  <path d="M83 198C232 118 329 250 466 168C591 94 686 246 817 165C947 84 1005 196 1117 126" stroke="#FFF7ED" stroke-width="2" stroke-linecap="round" opacity="0.75"/>

  <g font-family="Courier New, monospace" font-size="16" font-weight="700">
    <circle cx="83" cy="198" r="15" fill="#FF4D6D" stroke="#FFF7ED" stroke-width="3"/>
    <text x="54" y="248" fill="#FFF7ED">TASTE</text>

    <circle cx="312" cy="221" r="15" fill="#FFF7ED" stroke="#171717" stroke-width="3"/>
    <text x="249" y="276" fill="#FFF7ED">PRODUCT SHAPE</text>

    <circle cx="466" cy="168" r="15" fill="#E8FF5B" stroke="#171717" stroke-width="3"/>
    <text x="398" y="218" fill="#FFF7ED">DESIGN SYSTEMS</text>

    <circle cx="676" cy="204" r="15" fill="#2DD4BF" stroke="#171717" stroke-width="3"/>
    <text x="627" y="263" fill="#FFF7ED">AI AGENTS</text>

    <circle cx="817" cy="165" r="15" fill="#FFF7ED" stroke="#171717" stroke-width="3"/>
    <text x="771" y="118" fill="#FFF7ED">CODE</text>

    <circle cx="1117" cy="126" r="15" fill="#FF4D6D" stroke="#FFF7ED" stroke-width="3"/>
    <text x="1030" y="86" fill="#FFF7ED">SHIPPED PRODUCT</text>
  </g>

  <rect x="822" y="235" width="300" height="38" rx="19" fill="#FFF7ED"/>
  <text x="846" y="260" fill="#171717" font-family="Courier New, monospace" font-size="15" font-weight="700">Mew.Design is the live canvas</text>
</svg>
