    <circle cx="1008" cy="280" r="8" fill="#FFF7ED" stroke="#171717" stroke-width="3"/>
  </g>

  <rect x="72" y="72" width="506" height="360" rx="0" fill="#FFFDF8" stroke="#171717" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="96" y="98" width="132" height="34" fill="#171717"/>
  <text x="112" y="121" fill="#FFFDF8" font-family="Courier New, monospace" font-size="15" font-weight="700">AI ATELIER</text>
  <rect x="244" y="98" width="168" height="34" fill="#E8FF5B" stroke="#171717" stroke-width="2"/>
  <text x="260" y="121" fill="#171717" font-family="Courier New, monospace" font-size="15" font-weight="700">DESIGN PRODUCT</text>

  <text x="92" y="210" fill="#171717" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-weight="700">Elliot</text>
  <text x="92" y="286" fill="#171717" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-weight="700">Bai</text>
  <rect x="96" y="306" width="306" height="10" fill="url(#signal)"/>
  <text x="96" y="358" fill="#171717" font-family="Courier New, monospace" font-size="19" font-weight="700">ART / DESIGN / PRODUCT / AI</text>
  <text x="96" y="391" fill="#171717" font-family="Courier New, monospace" font-size="17">Co-founder at Mew.Design</text>

  <g transform="translate(92 452)">
    <rect width="166" height="38" rx="19" fill="#171717"/>
    <text x="24" y="25" fill="#FFFDF8" font-family="Courier New, monospace" font-size="14" font-weight="700">taste to tools</text>
    <rect x="180" width="158" height="38" rx="19" fill="#FF4D6D" stroke="#171717" stroke-width="2"/>
    <text x="203" y="25" fill="#171717" font-family="Courier New, monospace" font-size="14" font-weight="700">idea to system</text>
  </g>

  <rect x="642" y="72" width="474" height="374" fill="url(#dotGrid)" opacity="0.72"/>
  <path d="M650 446H1115" stroke="#171717" stroke-width="2"/>
  <path d="M642 72V446" stroke="#171717" stroke-width="2"/>
