<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Elliot Bai, AI Design Product Builder</title>
  <desc id="desc">An editorial atelier-style hero graphic for an AI design product builder.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF7ED"/>
      <stop offset="0.44" stop-color="#F7FAFC"/>
      <stop offset="1" stop-color="#E8FFF7"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171717"/>
      <stop offset="1" stop-color="#343434"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4D6D"/>
      <stop offset="0.5" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#E8FF5B"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF4D6D" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FF4D6D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#171717" opacity="0.22"/>
    </pattern>
    <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 7.5H8" stroke="#171717" stroke-opacity="0.13" stroke-width="1"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#111827" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1200" height="560" rx="34" fill="url(#paper)"/>
  <rect x="22" y="22" width="1156" height="516" rx="28" fill="url(#scan)" opacity="0.7"/>
  <rect x="22" y="22" width="1156" height="516" rx="28" stroke="#171717" stroke-width="2"/>

  <circle cx="888" cy="106" r="176" fill="url(#glowB)" opacity="0.75"/>
  <circle cx="1012" cy="364" r="226" fill="url(#glowA)" opacity="0.65"/>
  <circle cx="226" cy="434" r="178" fill="#E8FF5B" opacity="0.42"/>

  <path d="M704 73C808 40 936 44 1038 88C1118 122 1152 182 1126 245C1096 318 982 336 873 307C772 281 681 210 680 147C679 111 689 84 704 73Z" fill="#171717" opacity="0.95"/>
