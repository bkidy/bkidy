  <text x="896" y="392" fill="#FFFDF8" font-family="Courier New, monospace" font-size="17" font-weight="700">visual logic</text>

  <path d="M586 68L612 44L638 68L612 92L586 68Z" fill="#E8FF5B" stroke="#171717" stroke-width="2"/>
  <path d="M1087 482L1132 463L1154 507L1107 523L1087 482Z" fill="#2DD4BF" stroke="#171717" stroke-width="2"/>
  <path d="M40 478C77 472 104 486 118 520" stroke="#FF4D6D" stroke-width="10" stroke-linecap="round"/>
