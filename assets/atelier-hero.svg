    <path d="M752 180L822 246L956 196L1008 280" stroke="#171717" stroke-width="2" stroke-linecap="round" opacity="0.62"/>
    <circle cx="752" cy="180" r="8" fill="#FFF7ED" stroke="#171717" stroke-width="3"/>
    <circle cx="852" cy="142" r="8" fill="#E8FF5B" stroke="#171717" stroke-width="3"/>
    <circle cx="956" cy="196" r="8" fill="#FF4D6D" stroke="#171717" stroke-width="3"/>
