  <path d="M750 319C830 377 926 414 1034 430" stroke="#171717" stroke-width="3" stroke-linecap="round"/>
  <path d="M764 351C842 402 924 436 1027 458" stroke="#171717" stroke-width="1.6" stroke-linecap="round" opacity="0.58"/>
  <path d="M732 391C809 447 889 479 994 496" stroke="#171717" stroke-width="1.6" stroke-linecap="round" opacity="0.58"/>

